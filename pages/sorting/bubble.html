<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bubble Sort</title>
    <link rel="stylesheet" href="../../styles/pages/sorting/styles.css">
</head>

<body>
    <!-- Header with hamburger menu, logo and website name -->
    <header class="main-header">
        <a href="../../index.html" class="logo">
            <img src="../../assets/images/Icon.gif" width="40" alt="Logo">
        </a>
        <h1 class="page-title"><a href="../../index.html">VisualDSA</a></h1>
        <div class="header-controls">
            <button id="theme-toggle">🌙</button>
            <button id="menu-toggle">☰</button>
            <nav class="nav-menu" id="menu">
                <ul>
                    <li><a href="../home.html">Home</a></li>
                    <li><a href="#">Sorting</a></li>
                    <li><a href="#">Search</a></li>
                    <li><a href="#">Help</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <nav class="progress-bar">
        <button class="prev-btn">Previous</button>
        <div class="progress-container">
            <div class="progress-indicator">
                <div class="progress-fill"></div>
            </div>
            <div class="step-item" data-step="0">
                <div class="step-circle" id="circle-0">1</div>
                <div class="step-label">Theory</div>
            </div>
            <div class="step-item" data-step="1">
                <div class="step-circle" id="circle-1">2</div>
                <div class="step-label">Algorithm</div>
            </div>
            <div class="step-item" data-step="2">
                <div class="step-circle" id="circle-2">3</div>
                <div class="step-label">Visualization</div>
            </div>
        </div>
        <button class="next-btn">Next</button>
    </nav>

    <div class="content-wrapper">
        <section id="section-0" class="content-section active">
            <!-- <h1>Theory of Bubble Sort</h1> -->
            <div id="theory-content"></div>
        </section>

        <section id="section-1" class="content-section">
            <!-- <h1>Bubble Sort Algorithm</h1> -->
            <div id="algorithm-content"></div>
        </section>

        <section id="section-2" class="content-section">
            <!-- <h1>Visualization of Bubble Sort</h1> -->
            <div id="visualization-content"></div>
        </section>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Function to load HTML content into a specified container
            function loadContent(url, containerId) {
                fetch(url)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Failed to load ${url}: ${response.statusText}`);
                        }
                        return response.text();
                    })
                    .then(html => {
                        document.getElementById(containerId).innerHTML = html;
                    })
                    .catch(error => {
                        console.error(error);
                        document.getElementById(containerId).innerHTML = "<p>Content failed to load.</p>";
                    });
            }

            // Load content for each section
            loadContent('theory.html', 'theory-content');
            loadContent('algorithm.html', 'algorithm-content');
            loadContent('visualization.html', 'visualization-content');
        });


        (function () {
            // Cache DOM elements for navigation and theme toggling
            const steps = document.querySelectorAll(".step-item");
            const circles = document.querySelectorAll(".step-circle");
            const sections = document.querySelectorAll(".content-section");
            const nextBtns = document.querySelectorAll(".next-btn");
            const prevBtns = document.querySelectorAll(".prev-btn");
            const themeToggleBtn = document.getElementById("theme-toggle");
            const menuToggle = document.getElementById("menu-toggle");
            const menu = document.getElementById("menu");
            const progressFill = document.querySelector(".progress-fill");

            let currentStep = 0;
            let completedSteps = [false, false, false];

            if (localStorage.getItem("currentStep")) {
                currentStep = parseInt(localStorage.getItem("currentStep"), 10);
            }
            if (localStorage.getItem("completedSteps")) {
                completedSteps = JSON.parse(localStorage.getItem("completedSteps"));
            }
            const savedTheme = localStorage.getItem("theme") || "light";
            document.documentElement.setAttribute("data-theme", savedTheme);

            function updateNav() {
                steps.forEach((step, index) => {
                    step.classList.remove("active", "completed");
                    if (completedSteps[index]) {
                        step.classList.add("completed");
                        circles[index].textContent = "✓";
                    } else {
                        circles[index].textContent = index + 1;
                    }
                });
                steps[currentStep].classList.add("active");

                const activeSection = sections[currentStep];
                const nextBtn = activeSection.querySelector(".next-btn");
                nextBtn.textContent = currentStep === sections.length - 1 ? "Complete" : "Next";

                // Update the progress line fill based on the current step.
                // For 3 steps: 0% (step 0), 50% (step 1), 100% (step 2)
                const fillPercentage = (currentStep / (steps.length - 1)) * 100;
                progressFill.style.width = fillPercentage + '%';
            }

            function showSection(index) {
                sections.forEach((section, i) => {
                    section.classList.toggle("active", i === index);
                });
                currentStep = index;
                localStorage.setItem("currentStep", currentStep);
                updateNav();
            }

            nextBtns.forEach((btn) => {
                btn.addEventListener("click", () => {
                    if (currentStep < sections.length - 1) {
                        completedSteps[currentStep] = true;
                        localStorage.setItem("completedSteps", JSON.stringify(completedSteps));
                        showSection(currentStep + 1);
                    } else if (currentStep === sections.length - 1) {
                        window.location.href = "index.html";
                    }
                });
            });

            prevBtns.forEach((btn) => {
                btn.addEventListener("click", () => {
                    if (currentStep > 0) {
                        completedSteps[currentStep - 1] = false;
                        localStorage.setItem("completedSteps", JSON.stringify(completedSteps));
                        showSection(currentStep - 1);
                    }
                });
            });

            steps.forEach((step, index) => {
                step.addEventListener("click", () => {
                    if (index <= currentStep || completedSteps[index - 1]) {
                        showSection(index);
                    }
                });
            });

            themeToggleBtn.addEventListener("click", () => {
                let currentTheme = document.documentElement.getAttribute("data-theme");
                let newTheme = currentTheme === "light" ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", newTheme);
                localStorage.setItem("theme", newTheme);
            });

            menuToggle.addEventListener("click", () => {
                menu.classList.toggle("visible");
            });

            document.addEventListener("DOMContentLoaded", function () {
                const urlParams = new URLSearchParams(window.location.search);
                const section = urlParams.get("section");

                const sectionMap = {
                    concept: "section-0",
                    algorithm: "section-1",
                    visualization: "section-2"
                };

                if (section && sectionMap[section]) {
                    const targetSection = document.getElementById(sectionMap[section]);
                    if (targetSection) {
                        targetSection.scrollIntoView({ behavior: "smooth" });
                    }
                }
            });


            showSection(currentStep);
            updateNav();
        })();
    </script>
</body>

</html>
