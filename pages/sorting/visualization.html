<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Visualizer</title>
    <link rel="stylesheet" href="../../styles/pages/bubble.css">
</head>

<body>
    <div class="info-panel" id="info-panel">
        <span>
            <strong id="loop-values">Phase: 0, Compare: 0</strong>
            Current Operation: <strong id="current-operation">Idle</strong>
            <span style="float: right;">
                <span class="legend-item">
                    <span class="color-box" style="background: var(--primary-color);"></span> Default
                </span>
                <span class="legend-item">
                    <span class="color-box" style="background: var(--comparing-color);"></span> Comparing
                </span>
                <span class="legend-item">
                    <span class="color-box" style="background: var(--swapping-color);"></span> Swapping
                </span>
                <span class="legend-item">
                    <span class="color-box" style="background: var(--secondary-color);"></span> Not Swapped
                </span>
            </span>
        </span>
    </div>
    <div class="visualization-container">
        <aside class="controls">
            <h2>Controls</h2>
            <!-- <label for="algorithm">Choose Algorithm:</label>
            <select id="algorithm">
                <option value="bubble">Bubble Sort</option>
                <option value="insertion">Insertion</option>
            </select> -->
            <label for="bar-count">Number of Bars:</label>
            <input type="number" id="bar-count" value="10" min="5" max="50">
            <label for="bar-values">Enter Bar Values (comma separated):</label>
            <input type="text" id="bar-values" placeholder="e.g., 10,20,30">
            <label for="speed">Animation Speed: <span id="speed-value">500</span>ms</label>
            <input type="range" id="speed" value="500" min="50" max="2000" step="50">
            <button id="start">Start</button>
            <button id="reset">Reset</button>
        </aside>
        <section class="visualization" id="visualization">
            <!-- Visualization -->
        </section>
    </div>
</body>

</html>
