<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Linked List</title>
    <link rel="stylesheet" href="../../styles/pages/sorting/styles.css">
</head>

<body class="theme-classic">
    <header class="main-header">
        <a href="../../index.html" class="logo">
            <img src="../../assets/images/Icon.gif" width="40" alt="Logo">
        </a>
        <h1 class="page-title"><a href="../../index.html">VisualDSA</a></h1>
        <div class="header-controls">
            <button id="bgm-toggle" class="bgm-toggle" title="Toggle Background Music">
                <span class="icon">🔊</span>
            </button>
            <label for="theme-select">Theme:</label>
            <select id="theme-select" class="theme-select">
                <option value="default">Default</option>
                <option value="dark">Dark</option>
                <option value="modern">Modern</option>
                <option value="royal">Royal</option>
                <option value="elegant">Elegant</option>
            </select>
            <button id="menu-toggle">☰</button>
            <nav class="nav-menu" id="menu">
                <ul>
                    <li><a href="../home.html">Home</a></li>
                    <li><a href="#">Sorting</a></li>
                    <li><a href="#">Search</a></li>
                    <li><a href="#">Help</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <audio id="bgm" loop>
        <source src="../../assets/audio/background-music.mp3" type="audio/mp3">
    </audio>

    <nav class="progress-bar">
        <button class="prev-btn">Previous</button>
        <div class="progress-container">
            <div class="progress-indicator">
                <div class="progress-fill"></div>
            </div>
            <div class="step-item" data-step="0">
                <div class="step-circle" id="circle-0">1</div>
                <div class="step-label">Theory</div>
            </div>
            <div class="step-item" data-step="1">
                <div class="step-circle" id="circle-1">2</div>
                <div class="step-label">Algorithm</div>
            </div>
            <div class="step-item" data-step="2">
                <div class="step-circle" id="circle-2">3</div>
                <div class="step-label">Visualization</div>
            </div>
        </div>
        <button class="next-btn">Next</button>
    </nav>

    <div class="content-wrapper">
        <section id="section-0" class="content-section active">
            <!-- <h1>Theory of Bubble Sort</h1> -->
            <div id="theory-content"></div>
        </section>

        <section id="section-1" class="content-section">
            <!-- <h1>Bubble Sort Algorithm</h1> -->
            <div id="algorithm-content"></div>
        </section>

        <section id="section-2" class="content-section">
            <!-- <h1>Visualization of Bubble Sort</h1> -->
            <div id="visualization-content"></div>
        </section>
    </div>

    <script type="module" src="../../scripts/linkedList/base.js"></script>
    <style>
        .bgm-toggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            padding: 5px 10px;
            border-radius: 5px;
            margin-right: 10px;
            transition: transform 0.2s;
        }

        .bgm-toggle:hover {
            transform: scale(1.1);
        }
    </style>
</body>

</html>
