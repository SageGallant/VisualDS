<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linked List Visualization</title>
    <link rel="stylesheet" href="../../styles/pages/sorting/visualization.css">
    <link rel="stylesheet" href="../../styles/pages/linkedList/visualization.css">
</head>

<body>
    <main class="main-container">
        <!-- Visualization Section -->
        <section class="visualization-section">
            <div class="visualization-container">
                <div class="container">
                    <div class="controls">
                        <input type="text" id="nodeValue" class="input-field" placeholder="Enter value">
                        <button class="btn" onclick="addNode()">Add Node</button>
                        <button class="btn" onclick="deleteLastNode()">Delete Last</button>
                        <button class="btn" onclick="traverse()">Traverse</button>
                    </div>
                    <div class="visualization">
                        <div class="moving-background"></div>
                        <div class="track"></div>
                        <div class="sleepers"></div>
                        <div class="train-container" id="trainContainer">
                            <div class="engine">
                                <div class="chimney">
                                    <div class="smoke"></div>
                                </div>
                                <div class="wheel front"></div>
                                <div class="wheel back"></div>
                                <div class="connector"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Info Section -->
        <section class="info-section">
            <div class="current-state">
                <h3>Current State</h3>
                <div class="state-info">
                    <p>Length: <span id="listLength">0</span></p>
                    <p>Operation: <span id="currentOperation">None</span></p>
                </div>
            </div>
            <!-- ...existing legend content... -->
        </section>
    </main>

    <!-- Audio elements -->
    <audio id="trainHorn" src="../../assets/audio/train-horn.mp3"></audio>
    <audio id="wheelSound" src="../../assets/audio/wheel-sound.mp3" loop></audio>
    <audio id="connectSound" src="../../assets/audio/connect-sound.mp3"></audio>
    <audio id="explosionSound" src="../../assets/audio/explosion-sound.mp3"></audio>

    <script src="../../scripts/linkedList/visualization.js">
    </script>
</body>

</html>
